[project]
name = "orchestrator"
version = "0.1.0"
description = "Native audio orchestrator for offline-voice-stack"
requires-python = ">=3.12"

dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "websockets>=13.0",
    "requests>=2.32",
    "openwakeword>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv]
package = true