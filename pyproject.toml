[project]
name = "offline-voice-stack"
version = "0.1.0"
description = "Fully offline, real-time voice-to-voice assistant"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[tool.uv.workspace]
members = [
    "orchestrator",
    "dashboard",
    "shared/protocol",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"