[project]
name = "stt-service"
version = "0.1.0"
description = "Speech to text service wrapping whisper.cpp"
requires-python = ">=3.11"
dependencies = [
    "pywhispercpp>=1.3.0",
    "websockets>=13.0",
    "numpy>=1.26",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_service"]

[tool.uv]
package = true