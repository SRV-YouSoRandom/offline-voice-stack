[project]
name = "tts-service"
version = "0.1.0"
description = "Text to speech service wrapping Kokoro-82M"
requires-python = ">=3.11"
dependencies = [
    "kokoro-onnx>=0.4.0",
    "websockets>=13.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_service"]

[tool.uv]
package = true