[project]
name = "dashboard"
version = "0.1.0"
description = "Streamlit visualization dashboard for offline-voice-stack"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.37.0",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.uv]
package = true